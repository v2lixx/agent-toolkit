<text x="1060.0" y="602" font-size="16" fill="#566b79" text-anchor="middle" font-weight="400">Cumulative synthetic history tokens (o200k_base)</text>
<text x="44" y="649" font-size="18" fill="#152e40" text-anchor="start" font-weight="400">gpt-5.5 · medium effort · 3 histories · means + observed seed ranges</text>
<text x="44" y="681" font-size="17" fill="#152e40" text-anchor="start" font-weight="400">Lines connect measured checkpoints, not a fitted forgetting law. Task requirements also grow: 32 → 48 → 64 → 80.</text>
<text x="44" y="713" font-size="17" fill="#566b79" text-anchor="start" font-weight="400">Harness-managed memory; unequal context lengths. Not natural compaction or a universal model-memory score.</text>
