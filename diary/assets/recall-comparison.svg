<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
<title id="title">Diary versus rolling-summary recall pilot</title>
<desc id="desc">Side-by-side curves plot exact requirement recall failure against cumulative synthetic history tokens. The experiment compares harness-managed external records and rolling summaries, not native model memory.</desc>
