<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="930" viewBox="0 0 1120 930" role="img" aria-labelledby="title desc">
  <title id="title">Diary: recursive task storage</title>
  <desc id="desc">The Diaries directory contains shared MCP code and independent root tasks. Task A owns a Diary. Its child B stores a separate Diary under A/Child/B. Grandchild C repeats the rule under B/Child/C, and further descendants continue recursively. Task D is an unrelated root with its own Diary.</desc>
  <defs>
    <style>
      .sans{font-family:Arial,Helvetica,sans-serif}.mono{font-family:Menlo,Consolas,monospace}
      .h{font-size:30px;font-weight:700;fill:#0f172a}.body{font-size:16px;fill:#475569}
      .path{font-size:20px;font-weight:700;fill:#0f172a}.small{font-size:14px;fill:#64748b}
      .badge{font-size:12px;font-weight:700;letter-spacing:1px}.line{fill:none;stroke:#94a3b8;stroke-width:2}
    </style>
  </defs>
  <rect width="1120" height="930" rx="20" fill="#f8fafc"/>
  <text x="42" y="53" class="sans h">One tree. Independent working memory.</text>
  <text x="42" y="82" class="sans body">Each child repeats the same storage rule relative to its immediate parent.</text>
  <rect x="42" y="112" width="1036" height="64" rx="12" fill="#0f172a"/>
  <text x="66" y="153" class="mono" font-size="24" font-weight="700" fill="#fff">~/Desktop/Diaries/</text>
  <text x="855" y="151" class="sans badge" fill="#cbd5e1">LOCAL STORAGE</text>
  <path d="M68 176V829 M68 239H100 M68 356H100 M68 829H100" class="line"/>

  <rect x="100" y="206" width="954" height="68" rx="10" fill="#fff" stroke="#cbd5e1"/>
  <text x="122" y="235" class="mono path">mcps/continuity-journal/</text>
  <text x="122" y="257" class="sans small">Shared implementation and tools — never a shared task Diary</text>
  <rect x="880" y="226" width="146" height="27" rx="13" fill="#e2e8f0"/>
  <text x="901" y="244" class="sans badge" fill="#475569">CODE ONLY</text>

  <rect x="100" y="310" width="954" height="454" rx="14" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="122" y="346" class="mono path">task-A/</text>
  <text x="820" y="343" class="sans badge" fill="#1d4ed8">ROOT TASK A</text>
  <text x="140" y="378" class="mono" font-size="18" fill="#1d4ed8">Diary</text>
  <text x="225" y="378" class="sans body">A's prompts, plan, progress, lessons, and status</text>
  <text x="140" y="404" class="mono small">scope.json · checkpoints/ · per-Diary lock</text>
  <path d="M140 421V468H167" class="line"/>
  <text x="155" y="443" class="mono small">Child/</text>

  <rect x="167" y="454" width="857" height="278" rx="12" fill="#f0fdfa" stroke="#5eead4"/>
  <text x="189" y="488" class="mono path">task-B/</text>
  <text x="790" y="485" class="sans badge" fill="#0f766e">CHILD OF A</text>
  <text x="207" y="519" class="mono" font-size="18" fill="#0f766e">Diary</text>
  <text x="292" y="519" class="sans body">B's separate work — not A's journal</text>
  <path d="M207 535V577H234" class="line"/>
  <text x="222" y="557" class="mono small">Child/</text>

  <rect x="234" y="566" width="760" height="134" rx="10" fill="#fff" stroke="#a5b4fc"/>
  <text x="256" y="600" class="mono path">task-C/</text>
  <text x="766" y="598" class="sans badge" fill="#4338ca">CHILD OF B</text>
  <text x="274" y="631" class="mono" font-size="18" fill="#4338ca">Diary</text>
  <text x="359" y="631" class="sans body">C's separate work</text>
  <text x="274" y="672" class="mono small">Child/…</text>
  <text x="390" y="672" class="sans small">Same rule for every further generation</text>

  <rect x="100" y="794" width="954" height="68" rx="10" fill="#fff" stroke="#cbd5e1"/>
  <text x="122" y="823" class="mono path">task-D/Diary</text>
  <text x="122" y="847" class="sans small">An independent root: its own numbering, lifecycle, locks, and checkpoints</text>
  <text x="860" y="830" class="sans badge" fill="#475569">ROOT TASK D</text>
  <text x="43" y="903" class="sans" font-size="16" fill="#334155">Completing a child never completes its parent. Every MCP call carries explicit task identity.</text>
</svg>
