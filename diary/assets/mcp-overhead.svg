<text x="76" y="409.0" font-size="16" fill="#566b79" text-anchor="end" font-weight="400">2,000</text>
<line x1="90" y1="337.0" x2="630" y2="337.0" stroke="#dae3e7" stroke-width="1"/>
<text x="76" y="343.0" font-size="16" fill="#566b79" text-anchor="end" font-weight="400">3,000</text>
<line x1="90" y1="271.0" x2="630" y2="271.0" stroke="#dae3e7" stroke-width="1"/>
<text x="76" y="277.0" font-size="16" fill="#566b79" text-anchor="end" font-weight="400">4,000</text>
<line x1="90" y1="205.0" x2="630" y2="205.0" stroke="#dae3e7" stroke-width="1"/>
