<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
<title id="title">Measured Diary MCP overhead</title>
<desc id="desc">Two charts show mean serialized token and warm MCP latency costs for three synthetic prompt lengths. Omitting Diary adds no Diary-specific bookkeeping, but total task cost is not measured here.</desc>
<rect width="1400" height="760" rx="20" fill="#f6f9fa"/>
<g font-family="Arial, Helvetica, sans-serif">
<text x="44" y="52" font-size="31" fill="#152e40" text-anchor="start" font-weight="700">What does one Diary block cost locally?</text>
<text x="44" y="85" font-size="19" fill="#566b79" text-anchor="start" font-weight="400">Measured MCP transport + storage; model thinking and writing are not included.</text>
<text x="90" y="144" font-size="23" fill="#152e40" text-anchor="start" font-weight="700">Added serialized tokens / block</text>
<text x="90" y="174" font-size="16" fill="#566b79" text-anchor="start" font-weight="400">Start → one milestone → complete</text>
<line x1="90" y1="535.0" x2="630" y2="535.0" stroke="#dae3e7" stroke-width="1"/>
<text x="76" y="541.0" font-size="16" fill="#566b79" text-anchor="end" font-weight="400">0</text>
<line x1="90" y1="469.0" x2="630" y2="469.0" stroke="#dae3e7" stroke-width="1"/>
<text x="76" y="475.0" font-size="16" fill="#566b79" text-anchor="end" font-weight="400">1,000</text>
