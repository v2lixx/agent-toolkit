<text x="1216.6666666666667" y="564" font-size="18" fill="#152e40" text-anchor="middle" font-weight="400">4,000</text>
<line x1="1216.6666666666667" y1="331.6749" x2="1216.6666666666667" y2="262.6532" stroke="#152e40" stroke-width="2"/>
<line x1="1207.6666666666667" y1="262.6532" x2="1225.6666666666667" y2="262.6532" stroke="#152e40" stroke-width="2"/>
<text x="1050.0" y="601" font-size="17" fill="#566b79" text-anchor="middle" font-weight="400">Original prompt length (o200k_base tokens)</text>
<text x="44" y="649" font-size="18" fill="#152e40" text-anchor="start" font-weight="400">90 blocks · warm connection · bars = mean · time whiskers = empirical p95</text>
<text x="44" y="681" font-size="18" fill="#152e40" text-anchor="start" font-weight="400">No Diary: 0 added Diary tokens and 0 Diary calls by definition — not zero total task cost.</text>
<text x="44" y="713" font-size="17" fill="#566b79" text-anchor="start" font-weight="400">Token counts are JSON serialization proxies, not provider billing. Single-host synthetic workload.</text>
</g>
</svg>
