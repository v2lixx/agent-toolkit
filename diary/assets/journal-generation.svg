<text x="44" y="85" font-size="18" fill="#566b79" text-anchor="start" font-weight="400">One batched generation + three actual MCP writes per block; original task already completed.</text>
<text x="90" y="144" font-size="23" fill="#152e40" text-anchor="start" font-weight="700">Reported model output tokens</text>
<text x="90" y="174" font-size="17" fill="#566b79" text-anchor="start" font-weight="400">3 samples per prompt-length scenario</text>
