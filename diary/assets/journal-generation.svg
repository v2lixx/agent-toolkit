<text x="44" y="681" font-size="17" fill="#152e40" text-anchor="start" font-weight="400">Without Diary: no optional bookkeeping stage. This does not compare total task time or rework saved.</text>
<text x="44" y="713" font-size="17" fill="#566b79" text-anchor="start" font-weight="400">Input/cache/reasoning counters are reported separately in the data. Output is not the full per-call token budget.</text>
