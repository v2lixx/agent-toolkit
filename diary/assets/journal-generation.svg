<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
<title id="title">Controlled model journal-writing overhead</title>
<desc id="desc">Measured output tokens and wall time for nine actual model-generated journal records. These are optional bookkeeping-stage costs, not end-to-end task costs.</desc>
