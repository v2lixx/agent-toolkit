name: Diary tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.14']
    defaults:
      run:
        working-directory: diary/mcps/continuity-journal
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install test dependencies
        run: python -m pip install -r ../../benchmarks/requirements.txt
      - name: Run isolated regression and MCP tests
        run: python -m unittest discover -s tests -v
      - name: Test benchmark machinery without model calls
        run: python -m unittest discover -s ../../benchmarks/tests -v
